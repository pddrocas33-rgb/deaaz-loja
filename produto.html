<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeAaZ - Detalhe do Produto</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; line-height: 1.6; }

    .header-nav { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 1.5rem; font-weight: 800; color: #0f172a; text-decoration: none; }
    .logo span { color: #2563eb; }

    .user-actions { display: flex; align-items: center; }
    .cart-btn {
      position: relative;
      background: #f1f5f9;
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .cart-btn:hover { background: #e2e8f0; }
    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #f97316;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-page-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    
    .breadcrumb { font-size: 0.85rem; color: #64748b; margin-bottom: 24px; }
    .breadcrumb a { color: #2563eb; text-decoration: none; font-weight: 600; }

    .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; background: #ffffff; padding: 36px; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }

    /* ÁREA DA FOTO E MINIATURAS */
    .gallery-container { display: flex; flex-direction: column; gap: 16px; }
    .main-image-box { width: 100%; height: 420px; background: #f1f5f9; border-radius: 14px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; }
    .main-image-box img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.25s ease; }

    .thumbnails-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .thumb-item { width: 70px; height: 70px; border-radius: 10px; border: 2px solid #cbd5e1; overflow: hidden; cursor: pointer; opacity: 0.6; transition: all 0.2s; flex-shrink: 0; background: #fff; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-item:hover { opacity: 0.9; }
    .thumb-item.active { border-color: #2563eb; opacity: 1; transform: scale(1.05); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25); }

    /* DETALHES E OPÇÕES */
    .product-info { display: flex; flex-direction: column; }
    .category-badge { display: inline-block; align-self: flex-start; background: #eff6ff; color: #2563eb; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-bottom: 12px; }
    .product-title { font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 12px; }
    .product-price { font-size: 2rem; font-weight: 800; color: #2563eb; margin-bottom: 20px; }

    .variants-section { margin-bottom: 24px; padding: 16px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
    .variants-label { font-size: 0.9rem; font-weight: 700; color: #334155; margin-bottom: 10px; display: block; }
    .selected-color-name { font-weight: 500; color: #64748b; }

    .description-box { margin-bottom: 30px; }
    .description-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: #334155; }
    .description-box p { color: #475569; font-size: 0.95rem; white-space: pre-line; }

    /* BOTÕES DE AÇÃO */
    .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: auto; }
    
    .btn-cart-secondary {
      background: #eff6ff;
      color: #2563eb;
      border: 2px solid #2563eb;
      padding: 15px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .btn-cart-secondary:hover {
      background: #dbeafe;
    }

    .btn-buy-primary {
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #2563eb;
      padding: 15px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .btn-buy-primary:hover {
      background: #1d4ed8;
      border-color: #1d4ed8;
    }

    @media (max-width: 850px) {
      .product-layout { grid-template-columns: 1fr; gap: 28px; padding: 20px; }
      .main-image-box { height: 320px; }
      .actions-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="index.html" class="logo">De<span>AaZ</span></a>
    <div class="user-actions">
      <a href="carrinho.html" class="cart-btn">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Carrinho</span>
        <div class="cart-badge" id="cart-counter">0</div>
      </a>
    </div>
  </header>

  <div class="product-page-container">
    <div class="breadcrumb">
      <a href="index.html">Loja</a> &rsaquo; <span id="bread-category">Artigo</span> &rsaquo; <span id="bread-name">A carregar...</span>
    </div>

    <div class="product-layout" id="product-card-details">
      <!-- FOTO PRINCIPAL E SUB-ITENS -->
      <div class="gallery-container">
        <div class="main-image-box">
          <img id="main-product-img" src="" alt="Produto">
        </div>
        <div class="thumbnails-row" id="thumbnails-row"></div>
      </div>

      <!-- INFORMAÇÕES DO ARTIGO -->
      <div class="product-info">
        <span class="category-badge" id="product-category">Categoria</span>
        <h1 class="product-title" id="product-title">Nome do Artigo</h1>
        <div class="product-price" id="product-price">0.00 €</div>

        <div class="variants-section" id="variants-section">
          <span class="variants-label">Opção selecionada: <span class="selected-color-name" id="selected-color-text">Padrão</span></span>
        </div>

        <div class="description-box">
          <h3>Descrição do Artigo</h3>
          <p id="product-desc">Sem descrição detalhada disponível.</p>
        </div>

        <!-- DOIS BOTÕES: ADICIONAR E COMPRAR -->
        <div class="actions-row">
          <button type="button" class="btn-cart-secondary" onclick="adicionarProduto(false)">
            <i class="fa-solid fa-cart-plus"></i> Adicionar ao Carrinho
          </button>
          <button type="button" class="btn-buy-primary" onclick="adicionarProduto(true)">
            <i class="fa-solid fa-bolt"></i> Comprar Agora
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://omtlfwrrqketuaxufmkd.supabase.co/rest/v1";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tdGxmd3JycWtldHVheHVmbWtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDA5OTgsImV4cCI6MjEwMTY3Njk5OH0.vTDHpe2HmFNgJ2T9diTwbGParsMpcoeqDzhoivrtELo";

    const HEADERS = {
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type": "application/json"
    };

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    let produtoAtual = null;
    let fotoSelecionada = '';
    let varianteSelecionada = 'Padrão';

    function atualizarContadorCarrinho() {
      let carrinho = [];
      try {
        carrinho = JSON.parse(localStorage.getItem('deaaz_cart')) || [];
      } catch (e) {
        carrinho = [];
      }
      const total = carrinho.reduce((sum, item) => sum + (item.qtd || 1), 0);
      const badge = document.getElementById('cart-counter');
      if (badge) badge.innerText = total;
    }

    function adicionarProduto(redirecionarParaCarrinho = false) {
      if (!produtoAtual) return;

      let carrinho = [];
      try {
        carrinho = JSON.parse(localStorage.getItem('deaaz_cart')) || [];
      } catch (e) {
        carrinho = [];
      }

      const itemExistente = carrinho.find(p => p.id.toString() === produtoAtual.id.toString() && p.variante === varianteSelecionada);

      if (itemExistente) {
        itemExistente.qtd = (itemExistente.qtd || 1) + 1;
      } else {
        carrinho.push({
          id: produtoAtual.id,
          nome: produtoAtual.nome,
          preco: produtoAtual.preco,
          categoria: produtoAtual.categoria,
          imagem: fotoSelecionada || produtoAtual.imagem,
          variante: varianteSelecionada,
          qtd: 1
        });
      }

      localStorage.setItem('deaaz_cart', JSON.stringify(carrinho));
      atualizarContadorCarrinho();

      if (redirecionarParaCarrinho) {
        window.location.href = "carrinho.html";
      } else {
        alert(`"${produtoAtual.nome}" (${varianteSelecionada}) adicionado ao carrinho!`);
      }
    }

    async function carregarDetalheProduto() {
      if (!productId) {
        document.querySelector('.product-layout').innerHTML = "<p>Nenhum produto especificado na ligação.</p>";
        return;
      }

      try {
        const res = await fetch(`${API_URL}/produtos?id=eq.${productId}`, { headers: HEADERS });
        const data = await res.json();
        
        if (!data || data.length === 0) {
          document.querySelector('.product-layout').innerHTML = "<p>Artigo não encontrado.</p>";
          return;
        }

        produtoAtual = data[0];

        document.getElementById('bread-category').innerText = produtoAtual.categoria || 'Geral';
        document.getElementById('bread-name').innerText = produtoAtual.nome;
        document.getElementById('product-category').innerText = produtoAtual.categoria || 'Geral';
        document.getElementById('product-title').innerText = produtoAtual.nome;
        document.getElementById('product-price').innerText = `${parseFloat(produtoAtual.preco).toFixed(2)} €`;
        document.getElementById('product-desc').innerText = produtoAtual.descricao || 'Este produto ainda não possui especificações detalhadas.';

        const mainImg = document.getElementById('main-product-img');
        mainImg.src = produtoAtual.imagem || 'https://via.placeholder.com/400';
        fotoSelecionada = produtoAtual.imagem;

        const thumbsRow = document.getElementById('thumbnails-row');
        thumbsRow.innerHTML = '';

        const todasAsFotos = [];

        if (produtoAtual.imagem) {
          todasAsFotos.push({ nome: 'Padrão', foto: produtoAtual.imagem });
        }

        if (Array.isArray(produtoAtual.variantes)) {
          produtoAtual.variantes.forEach(v => {
            if (v.foto) todasAsFotos.push(v);
          });
        }

        if (todasAsFotos.length > 1) {
          todasAsFotos.forEach((item, index) => {
            const thumb = document.createElement('div');
            thumb.className = `thumb-item ${index === 0 ? 'active' : ''}`;
            thumb.innerHTML = `<img src="${item.foto}" alt="${item.nome}">`;
            
            thumb.onclick = () => {
              mainImg.style.opacity = '0.4';
              setTimeout(() => {
                mainImg.src = item.foto;
                mainImg.style.opacity = '1';
              }, 120);

              document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
              thumb.classList.add('active');

              varianteSelecionada = item.nome;
              fotoSelecionada = item.foto;
              document.getElementById('selected-color-text').innerText = item.nome;
            };

            thumbsRow.appendChild(thumb);
          });
        } else {
          document.getElementById('variants-section').style.display = 'none';
        }

      } catch (err) {
        console.error(err);
        document.querySelector('.product-layout').innerHTML = "<p>Erro ao carregar dados do artigo.</p>";
      }
    }

    atualizarContadorCarrinho();
    carregarDetalheProduto();
  </script>
</body>
</html>
