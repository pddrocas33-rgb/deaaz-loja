<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeAaZ - Carrinho de Compras</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SDK OFICIAL DO PAYPAL -->
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=EUR"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f97316;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.5; }
    header { background: #ffffff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .top-bar { background: var(--text-dark); color: #fff; font-size: 0.8rem; text-align: center; padding: 6px 16px; font-weight: 500; }
    .main-header { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }
    .user-actions { display: flex; gap: 20px; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.9rem; }
    .cart-btn { position: relative; background: var(--bg-light); padding: 10px 16px; border-radius: 20px; }
    .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: white; font-size: 0.75rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .breadcrumb { max-width: 1200px; margin: 20px auto 0; padding: 0 16px; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    
    .cart-container { max-width: 1200px; margin: 30px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 420px; gap: 30px; }
    .cart-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .cart-items-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 20px; align-items: center; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .cart-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .cart-item-img { width: 80px; height: 80px; background: #f1f5f9; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border); }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    
    .cart-item-details { display: flex; flex-direction: column; gap: 4px; }
    .cart-item-title { font-weight: 600; font-size: 1rem; color: var(--text-dark); text-decoration: none; }
    .cart-item-category { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .cart-item-price { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-top: 4px; }
    
    .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .qty-controls { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .qty-btn { background: var(--bg-light); border: none; width: 30px; height: 30px; font-weight: 700; cursor: pointer; color: var(--text-dark); }
    .qty-btn:hover { background: #e2e8f0; }
    .qty-input { width: 35px; text-align: center; border: none; font-weight: 600; font-size: 0.9rem; outline: none; }
    .btn-remove { background: none; border: none; color: #ef4444; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-remove:hover { text-decoration: underline; }

    .summary-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: fit-content; box-shadow: var(--shadow); }
    .summary-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }

    /* SELECÇÃO DE MORADA DE ENVIO */
    .shipping-section {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .shipping-option {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      margin-bottom: 10px;
    }
    .shipping-option input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .shipping-preview {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.85rem;
      color: var(--text-dark);
      margin-top: 8px;
      line-height: 1.4;
    }

    .shipping-form-fields {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .shipping-form-fields.hidden { display: none; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .field-group input, .field-group select {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }
    .field-group input:focus, .field-group select:focus {
      border-color: var(--primary);
    }

    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted); }
    .summary-row.total { font-size: 1.25rem; font-weight: 800; color: var(--text-dark); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .shipping-free { color: #16a34a; font-weight: 700; }

    #paypal-button-container {
      margin-top: 16px;
    }

    .btn-simulate {
      width: 100%;
      background: #10b981;
      color: white;
      border: none;
      padding: 13px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-simulate:hover { background: #059669; }

    .continue-shopping { display: block; text-align: center; margin-top: 16px; color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    @media (max-width: 850px) {
      .cart-container { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    ⚡ Envio Grátis em encomendas superiores a 30€ | De A a Z, encontra tudo aqui!
  </div>

  <header>
    <div class="main-header">
      <a href="index.html" class="logo">De<span>AaZ</span></a>
      <div class="user-actions">
        <a href="index.html" class="action-btn">
          <i class="fa-solid fa-store"></i>
          <span>Loja</span>
        </a>
        <a href="carrinho.html" class="action-btn cart-btn">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>Carrinho</span>
          <div class="cart-badge" id="cart-counter">0</div>
        </a>
      </div>
    </div>
  </header>

  <div class="breadcrumb">
    <a href="index.html">Início</a> &gt; <span>Carrinho de Compras</span>
  </div>

  <div class="cart-container">
    <div>
      <h1 class="cart-title"><i class="fa-solid fa-cart-shopping"></i> Teu Carrinho</h1>
      <div class="cart-items-card" id="cart-items-container"></div>
    </div>

    <div>
      <div class="summary-card">
        <h2 class="summary-title"><i class="fa-solid fa-truck-fast" style="color:var(--primary);"></i> Morada de Envio</h2>
        
        <!-- SECÇÃO DE SELEÇÃO DE MORADA -->
        <div class="shipping-section">
          <!-- OPÇÃO 1: MORADA DE REGISTO -->
          <label class="shipping-option" id="opt-registo-label" style="display: none;">
            <input type="radio" name="opcao_envio" value="registo" id="radio-registo" checked onchange="alternarModoMorada()">
            <span>Enviar para a morada de registo</span>
          </label>

          <div class="shipping-preview" id="preview-morada-registo" style="display: none;">
            <div id="dados-morada-registo-texto">A carregar morada de registo...</div>
          </div>

          <!-- OPÇÃO 2: OUTRA MORADA OU CLIENTE NÃO AUTENTICADO -->
          <label class="shipping-option" style="margin-top: 10px;">
            <input type="radio" name="opcao_envio" value="outra" id="radio-outra" onchange="alternarModoMorada()">
            <span id="label-outra-morada">Enviar para outra morada</span>
          </label>

          <!-- CAMPOS DE MORADA EDITÁVEL -->
          <div class="shipping-form-fields hidden" id="campos-morada-editavel">
            <div class="field-group">
              <label>Nome Completo do Destinatário</label>
              <input type="text" id="env-nome" placeholder="Nome de quem recebe">
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>Email</label>
                <input type="email" id="env-email" placeholder="email@exemplo.com">
              </div>
              <div class="field-group">
                <label>NIF / Ref. Fiscal</label>
                <input type="text" id="env-nif" placeholder="Contribuinte">
              </div>
            </div>

            <div class="field-group">
              <label>Morada (Rua, Nº, Andar/Porta)</label>
              <input type="text" id="env-rua" placeholder="Ex: Av. da Liberdade, 10, 2º Dto">
            </div>

            <div class="field-row">
              <div class="field-group">
                <label>Código Postal</label>
                <input type="text" id="env-cp" placeholder="1000-001">
              </div>
              <div class="field-group">
                <label>Cidade</label>
                <input type="text" id="env-cidade" placeholder="Lisboa">
              </div>
            </div>

            <div class="field-group">
              <label>País</label>
              <select id="env-pais">
                <option value="Portugal" selected>Portugal</option>
                <option value="Espanha">Espanha</option>
                <option value="França">França</option>
                <option value="Brasil">Brasil</option>
                <option value="Angola">Angola</option>
                <option value="Moçambique">Moçambique</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
          </div>
        </div>

        <h2 class="summary-title"><i class="fa-solid fa-receipt" style="color:var(--primary);"></i> Resumo</h2>

        <div class="summary-row">
          <span>Subtotal</span>
          <span id="resumo-subtotal">0.00€</span>
        </div>
        <div class="summary-row">
          <span>Envio</span>
          <span class="shipping-free">GRÁTIS</span>
        </div>
        
        <div class="summary-row total">
          <span>Total</span>
          <span id="resumo-total">0.00€</span>
        </div>

        <!-- BOTÕES PAYPAL -->
        <div id="paypal-button-container"></div>

        <!-- SIMULAR PAGAMENTO (TESTE DIRETO) -->
        <button type="button" class="btn-simulate" onclick="simularPagamentoImediato()">
          <i class="fa-solid fa-circle-check"></i> Simular Pagamento Concluído (Teste)
        </button>

        <a href="index.html" class="continue-shopping">&larr; Continuar a comprar</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://omtlfwrrqketuaxufmkd.supabase.co/rest/v1";
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tdGxmd3JycWtldHVheHVmbWtkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDA5OTgsImV4cCI6MjEwMTY3Njk5OH0.vTDHpe2HmFNgJ2T9diTwbGParsMpcoeqDzhoivrtELo";

    const HEADERS = {
      "apikey": API_KEY,
      "Authorization": "Bearer " + API_KEY,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    let dadosClienteSupabase = null;

    function obterCarrinho() {
      try {
        return JSON.parse(localStorage.getItem('deaaz_cart')) || [];
      } catch (e) {
        return [];
      }
    }

    function guardarCarrinho(carrinho) {
      localStorage.setItem('deaaz_cart', JSON.stringify(carrinho));
      atualizarContadorBadge();
    }

    function atualizarContadorBadge() {
      const carrinho = obterCarrinho();
      const totalItens = carrinho.reduce((sum, item) => sum + (item.qtd || 1), 0);
      const badge = document.getElementById('cart-counter');
      if (badge) badge.innerText = totalItens;
    }

    function calcularTotalCarrinho() {
      const carrinho = obterCarrinho();
      return carrinho.reduce((sum, item) => sum + (parseFloat(item.preco || 0) * parseInt(item.qtd || 1, 10)), 0);
    }

    /* GESTÃO DA MORADA DE ENVIO (REGISTO VS MANUAL) */
    async function inicializarMoradaEnvio() {
      const userLocal = localStorage.getItem('deaaz_user');
      const optRegistoLabel = document.getElementById('opt-registo-label');
      const previewRegisto = document.getElementById('preview-morada-registo');
      const radioRegisto = document.getElementById('radio-registo');
      const radioOutra = document.getElementById('radio-outra');
      const labelOutra = document.getElementById('label-outra-morada');

      if (!userLocal) {
        // Sem sessão iniciada: força o preenchimento manual
        optRegistoLabel.style.display = 'none';
        previewRegisto.style.display = 'none';
        radioOutra.checked = true;
        labelOutra.innerText = "Preencher dados de entrega";
        alternarModoMorada();
        return;
      }

      const user = JSON.parse(userLocal);

      // Tenta obter os dados atualizados com Morada e NIF direto da tabela clientes do Supabase
      try {
        const res = await fetch(`${API_URL}/clientes?email=eq.${encodeURIComponent(user.email)}`, { headers: HEADERS });
        const clientes = await res.json();
        if (Array.isArray(clientes) && clientes.length > 0) {
          dadosClienteSupabase = clientes[0];
        } else {
          dadosClienteSupabase = user;
        }
      } catch (e) {
        dadosClienteSupabase = user;
      }

      if (dadosClienteSupabase && dadosClienteSupabase.morada) {
        optRegistoLabel.style.display = 'flex';
        previewRegisto.style.display = 'block';
        radioRegisto.checked = true;
        labelOutra.innerText = "Enviar para outra morada";

        document.getElementById('dados-morada-registo-texto').innerHTML = `
          <strong>${dadosClienteSupabase.nome}</strong> (NIF: ${dadosClienteSupabase.nif || 'Não indicado'})<br>
          ${dadosClienteSupabase.morada}<br>
          ${dadosClienteSupabase.codigo_postal || ''} ${dadosClienteSupabase.cidade || ''}, <strong>${dadosClienteSupabase.pais || 'Portugal'}</strong>
        `;
      } else {
        // Tem sessão mas não tinha morada guardada
        optRegistoLabel.style.display = 'none';
        previewRegisto.style.display = 'none';
        radioOutra.checked = true;
        labelOutra.innerText = "Indicar dados de envio";
        document.getElementById('env-nome').value = dadosClienteSupabase?.nome || '';
        document.getElementById('env-email').value = dadosClienteSupabase?.email || '';
      }

      alternarModoMorada();
    }

    function alternarModoMorada() {
      const modoRegisto = document.getElementById('radio-registo').checked;
      const previewRegisto = document.getElementById('preview-morada-registo');
      const camposEditaveis = document.getElementById('campos-morada-editavel');

      if (modoRegisto && dadosClienteSupabase?.morada) {
        previewRegisto.style.display = 'block';
        camposEditaveis.classList.add('hidden');
      } else {
        previewRegisto.style.display = 'none';
        camposEditaveis.classList.remove('hidden');
      }
    }

    function recolherDadosEnvioFinais() {
      const modoRegisto = document.getElementById('radio-registo')?.checked;

      if (modoRegisto && dadosClienteSupabase && dadosClienteSupabase.morada) {
        return {
          nome: dadosClienteSupabase.nome,
          email: dadosClienteSupabase.email,
          nif: dadosClienteSupabase.nif || 'Consumidor Final',
          rua: dadosClienteSupabase.morada,
          codigo_postal: dadosClienteSupabase.codigo_postal || '',
          cidade: dadosClienteSupabase.cidade || '',
          pais: dadosClienteSupabase.pais || 'Portugal'
        };
      }

      // Lê campos editáveis
      const nome = document.getElementById('env-nome').value.trim();
      const email = document.getElementById('env-email').value.trim();
      const nif = document.getElementById('env-nif').value.trim();
      const rua = document.getElementById('env-rua').value.trim();
      const cp = document.getElementById('env-cp').value.trim();
      const cidade = document.getElementById('env-cidade').value.trim();
      const pais = document.getElementById('env-pais').value;

      if (!nome || !rua || !cp || !cidade) {
        alert("Por favor preencha todos os campos da morada de envio (Nome, Rua, Código Postal e Cidade).");
        return null;
      }

      return {
        nome,
        email: email || 'cliente@loja.com',
        nif: nif || 'Consumidor Final',
        rua,
        codigo_postal: cp,
        cidade,
        pais
      };
    }

    function alterarQtd(id, delta) {
      let carrinho = obterCarrinho();
      const item = carrinho.find(p => p.id.toString() === id.toString());
      if (item) {
        item.qtd = (item.qtd || 1) + delta;
        if (item.qtd <= 0) {
          carrinho = carrinho.filter(p => p.id.toString() !== id.toString());
        }
      }
      guardarCarrinho(carrinho);
      renderizarCarrinho();
    }

    function removerDoCarrinho(id) {
      let carrinho = obterCarrinho();
      carrinho = carrinho.filter(p => p.id.toString() !== id.toString());
      guardarCarrinho(carrinho);
      renderizarCarrinho();
    }

    function renderizarCarrinho() {
      const container = document.getElementById('cart-items-container');
      const carrinho = obterCarrinho();
      atualizarContadorBadge();

      if (carrinho.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 40px; color: #64748b;">
            <i class="fa-solid fa-bag-shopping fa-3x" style="margin-bottom: 12px; color: #cbd5e1;"></i>
            <p style="font-size: 1.1rem; font-weight: 600;">O teu carrinho está vazio.</p>
            <a href="index.html" style="display:inline-block; margin-top:16px; color:#2563eb; font-weight:700; text-decoration:none;">
              &larr; Ver produtos da loja
            </a>
          </div>
        `;
        document.getElementById('resumo-subtotal').innerText = '0.00€';
        document.getElementById('resumo-total').innerText = '0.00€';
        document.getElementById('paypal-button-container').style.display = 'none';
        return;
      }

      document.getElementById('paypal-button-container').style.display = 'block';

      let subtotal = 0;

      container.innerHTML = carrinho.map(item => {
        const preco = parseFloat(item.preco || 0);
        const qtd = parseInt(item.qtd || 1, 10);
        subtotal += preco * qtd;

        return `
          <div class="cart-item">
            <div class="cart-item-img">
              <img src="${item.imagem || 'https://via.placeholder.com/80'}" alt="${item.nome}" onerror="this.src='https://via.placeholder.com/80'">
            </div>
            <div class="cart-item-details">
              <span class="cart-item-category">${item.categoria || 'Geral'}</span>
              <a href="produto.html?id=${item.id}" class="cart-item-title">${item.nome}</a>
              <div class="cart-item-price">${preco.toFixed(2)} €</div>
            </div>
            <div class="cart-item-actions">
              <div class="qty-controls">
                <button type="button" class="qty-btn" onclick="alterarQtd('${item.id}', -1)">-</button>
                <input type="text" class="qty-input" value="${qtd}" readonly>
                <button type="button" class="qty-btn" onclick="alterarQtd('${item.id}', 1)">+</button>
              </div>
              <button type="button" class="btn-remove" onclick="removerDoCarrinho('${item.id}')">
                <i class="fa-solid fa-trash-can"></i> Remover
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('resumo-subtotal').innerText = subtotal.toFixed(2) + '€';
      document.getElementById('resumo-total').innerText = subtotal.toFixed(2) + '€';
    }

    async function registarEncomendaPaga(transacaoInfo = {}) {
      const carrinho = obterCarrinho();
      const envio = recolherDadosEnvioFinais();

      if (!envio) return false;

      if (carrinho.length === 0) {
        alert("O teu carrinho está vazio.");
        return false;
      }

      const totalCalculado = calcularTotalCarrinho();

      const novaEncomenda = {
        cliente_nome: envio.nome,
        cliente_email: envio.email,
        cliente_nif: envio.nif,
        morada_rua: envio.rua,
        morada_codigo_postal: envio.codigo_postal,
        morada_cidade: envio.cidade,
        morada_pais: envio.pais,
        itens: carrinho.map(item => ({
          id: item.id,
          nome: item.nome,
          preco: item.preco,
          qtd: item.qtd || 1,
          imagem: item.imagem || ''
        })),
        total: totalCalculado,
        estado: 'Paga'
      };

      try {
        const res = await fetch(`${API_URL}/encomendas`, {
          method: "POST",
          headers: HEADERS,
          body: JSON.stringify(novaEncomenda)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.message || "Erro na base de dados");
        }

        alert("🎉 Pagamento concluído! A encomenda foi enviada para o painel de gestão com a morada selecionada.");
        localStorage.removeItem('deaaz_cart');
        renderizarCarrinho();
        return true;
      } catch (erro) {
        console.error("Falha ao gravar encomenda:", erro);
        alert("Erro ao gravar encomenda: " + erro.message);
        return false;
      }
    }

    async function simularPagamentoImediato() {
      await registarEncomendaPaga({ simulado: true });
    }

    if (window.paypal) {
      paypal.Buttons({
        style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
        createOrder: function(data, actions) {
          const envio = recolherDadosEnvioFinais();
          if (!envio) return actions.reject();

          const total = calcularTotalCarrinho().toFixed(2);
          return actions.order.create({
            purchase_units: [{
              amount: { value: total, currency_code: 'EUR' }
            }]
          });
        },
        onApprove: function(data, actions) {
          return actions.order.capture().then(function(details) {
            registarEncomendaPaga(details);
          });
        },
        onError: function(err) {
          console.error("Erro PayPal:", err);
          alert("Erro ao processar PayPal.");
        }
      }).render('#paypal-button-container');
    }

    inicializarMoradaEnvio();
    renderizarCarrinho();
  </script>
</body>
</html>
