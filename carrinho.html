<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeAaZ - Carrinho de Compras</title>
  
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* RESET & VARIÁVEIS */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f97316;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }
    body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.5; }
    header { background: #ffffff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .top-bar { background: var(--text-dark); color: #fff; font-size: 0.8rem; text-align: center; padding: 6px 16px; font-weight: 500; }
    .main-header { max-width: 1200px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .logo { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--primary); }
    .search-box { flex: 1; max-width: 600px; display: flex; position: relative; }
    .search-box input { width: 100%; padding: 12px 20px; border: 2px solid var(--border); border-radius: 30px; font-size: 0.95rem; outline: none; }
    .search-box button { position: absolute; right: 5px; top: 5px; bottom: 5px; width: 40px; background: var(--primary); border: none; border-radius: 50%; color: #fff; cursor: pointer; }
    .user-actions { display: flex; gap: 20px; align-items: center; }
    .action-btn { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 0.9rem; }
    .cart-btn { position: relative; background: var(--bg-light); padding: 10px 16px; border-radius: 20px; }
    .cart-badge { position: absolute; top: -5px; right: -5px; background: var(--accent); color: white; font-size: 0.75rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .breadcrumb { max-width: 1200px; margin: 20px auto 0; padding: 0 16px; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    
    /* ESTRUTURA DO CARRINHO */
    .cart-container { max-width: 1200px; margin: 30px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr 360px; gap: 30px; }
    .cart-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .cart-items-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto; gap: 20px; align-items: center; padding-bottom: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .cart-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
    .cart-item-img { width: 80px; height: 80px; background: #f1f5f9; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: var(--text-muted); position: relative; }
    .letter-tag-small { position: absolute; top: 4px; left: 4px; background: var(--text-dark); color: white; font-size: 0.6rem; font-weight: 700; padding: 1px 5px; border-radius: 3px; }
    .cart-item-details { display: flex; flex-direction: column; gap: 4px; }
    .cart-item-title { font-weight: 600; font-size: 1rem; color: var(--text-dark); text-decoration: none; }
    .cart-item-category { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .cart-item-price { font-size: 1.1rem; font-weight: 800; color: var(--text-dark); margin-top: 4px; }
    .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
    .qty-controls { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .qty-btn { background: var(--bg-light); border: none; width: 30px; height: 30px; font-weight: 700; cursor: pointer; color: var(--text-dark); }
    .qty-btn:hover { background: #e2e8f0; }
    .qty-input { width: 35px; text-align: center; border: none; font-weight: 600; font-size: 0.9rem; outline: none; }
    .btn-remove { background: none; border: none; color: #ef4444; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-remove:hover { text-decoration: underline; }

    /* RESUMO */
    .summary-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: fit-content; }
    .summary-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-muted); }
    .summary-row.total { font-size: 1.2rem; font-weight: 800; color: var(--text-dark); margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .shipping-free { color: #16a34a; font-weight: 600; }
    .btn-checkout { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-checkout:hover { background: var(--primary-dark); }
    .continue-shopping { display: block; text-align: center; margin-top: 15px; color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 600; }

    footer { background: #ffffff; border-top: 1px solid var(--border); margin-top: 60px; padding: 40px 16px 20px; }
    .footer-bottom { max-width: 1200px; margin: 0 auto; text-align: center; font-size: 0.8rem; color: var(--text-muted); }

    @media (max-width: 850px) {
      .cart-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="top-bar">
    ⚡ Envio Grátis em encomendas superiores a 30€ | De A a Z, encontra tudo aqui!
  </div>

  <!-- CABEÇALHO -->
  <header>
    <div class="main-header">
      <a href="index.html" class="logo">De<span>AaZ</span></a>
      
      <div class="search-box">
        <input type="text" placeholder="O que procuras hoje? Pesquisa de A a Z...">
        <button><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>

      <div class="user-actions">
        <a href="#" class="action-btn">
          <i class="fa-regular fa-user"></i>
          <span>Conta</span>
        </a>
        <a href="carrinho.html" class="action-btn cart-btn">
          <i class="fa-solid fa-bag-shopping"></i>
          <span>Carrinho</span>
          <div class="cart-badge">0</div>
        </a>
      </div>
    </div>
  </header>

  <!-- BREADCRUMB -->
  <div class="breadcrumb">
    <a href="index.html">Início</a> &gt; <span>Carrinho de Compras</span>
  </div>

  <!-- CONTEÚDO PRINCIPAL DO CARRINHO -->
  <div class="cart-container">

    <!-- SECTOR ESQUERDO: LISTA DE PRODUTOS NO CARRINHO -->
    <div>
      <h1 class="cart-title"><i class="fa-solid fa-cart-shopping"></i> Teu Carrinho</h1>

      <!-- AQUI É ONDE O APP.JS DESENHA OS PRODUTOS (cart-items-card) -->
      <div class="cart-items-card"></div>
    </div>

    <!-- SECTOR DIREITO: RESUMO DA COMPRA -->
    <div>
      <div class="summary-card">
        <h2 class="summary-title">Resumo do Pedido</h2>
        
        <div class="summary-row">
          <span>Subtotal</span>
          <span>0.00€</span>
        </div>
        <div class="summary-row">
          <span>Envio</span>
          <span class="shipping-free">GRÁTIS</span>
        </div>
        
        <div class="summary-row total">
          <span>Total</span>
          <span>0.00€</span>
        </div>

        <button class="btn-checkout">
          <i class="fa-solid fa-lock"></i> Finalizar Compra
        </button>

        <a href="produtos.html" class="continue-shopping">&larr; Continuar a comprar</a>
      </div>
    </div>

  </div>

  <!-- RODAPÉ -->
  <footer>
    <div class="footer-bottom">
      &copy; 2026 DeAaZ Marketplace. Todos os direitos reservados.
    </div>
  </footer>

  <!-- LIGAÇÃO OBRIGATÓRIA AO SCRIPT -->
  <script src="app.js"></script>
</body>
</html>
